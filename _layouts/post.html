---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {%- if page.tags and page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}
  </p>

  {%- if page.abstract %}
  <div class="abstract">{{ page.abstract | markdownify }}</div>
  {%- endif %}

  {{ content }}
</article>

<p class="back"><a href="{{ '/blog/' | relative_url }}">← all posts</a></p>
